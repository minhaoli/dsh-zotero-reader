<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zotero Paper Reader">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#7b241c"/>
    </linearGradient>
  </defs>
  <!-- 左侧：文档 -->
  <rect x="6" y="8" width="26" height="44" rx="3" fill="none" stroke="url(#g)" stroke-width="3"/>
  <line x1="12" y1="18" x2="26" y2="18" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="12" y1="25" x2="26" y2="25" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="21" y2="32" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 右侧：侧栏 -->
  <rect x="38" y="8" width="20" height="44" rx="3" fill="url(#g)" opacity="0.14"/>
  <rect x="38" y="8" width="20" height="44" rx="3" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- 右侧栏内的高亮条目：代表命中页码 -->
  <rect x="42" y="16" width="12" height="4" rx="2" fill="#e67e22"/>
  <rect x="42" y="24" width="12" height="2.6" rx="1.3" fill="url(#g)" opacity="0.6"/>
  <rect x="42" y="30" width="12" height="2.6" rx="1.3" fill="url(#g)" opacity="0.6"/>
  <rect x="42" y="36" width="8" height="2.6" rx="1.3" fill="url(#g)" opacity="0.6"/>
</svg>
